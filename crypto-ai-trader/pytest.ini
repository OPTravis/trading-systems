[pytest]
timeout = 30
addopts = --tb=short --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
[tool:pytest]
addopts = --cov=src --cov-report=term-missing --cov-report=html:htmlcov --cov-config=.coveragerc
[coverage:run]
source = src
omit =
    tests/*
    .venv/*
    scripts/*
[coverage:report]
fail_under = 60
show_missing = True
