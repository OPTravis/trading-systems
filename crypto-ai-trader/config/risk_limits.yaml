# Risk Management Configuration
# Surge-aware: wider SL to survive bottom volatility, higher TP1 for better R:R
# Previous SL 7% was getting stopped out in <6h during extreme fear volatility
# Now SL 9% gives trades room to breathe, TP1 raised to 6% to avoid premature exits

risk:
  max_position_pct: 15
  max_total_exposure_pct: 70
  cash_reserve_pct: 30
  max_daily_loss_pct: 5
  max_drawdown_pct: 15
  max_open_positions: 5
  max_hold_hours: 48

strategies:
  grid:
    stop_loss_pct: 9.0
    take_profit_levels:
      - { pct: 6.0, size_pct: 40 }
      - { pct: 12.0, size_pct: 40 }
      - { pct: 20.0, size_pct: 20 }
    max_hold_hours: 48

  dca:
    stop_loss_pct: 14.0
    take_profit_levels:
      - { pct: 6.0, size_pct: 40 }
      - { pct: 12.0, size_pct: 40 }
      - { pct: 20.0, size_pct: 20 }
    max_hold_hours: 72

  trend:
    stop_loss_pct: 9.0
    take_profit_levels:
      - { pct: 6.0, size_pct: 40 }
      - { pct: 12.0, size_pct: 40 }
      - { pct: 20.0, size_pct: 20 }
    max_hold_hours: 48

  rsi:
    stop_loss_pct: 9.0
    take_profit_levels:
      - { pct: 6.0, size_pct: 40 }
      - { pct: 12.0, size_pct: 40 }
      - { pct: 20.0, size_pct: 20 }
    max_hold_hours: 48

  bollinger:
    stop_loss_pct: 9.0
    take_profit_levels:
      - { pct: 6.0, size_pct: 40 }
      - { pct: 12.0, size_pct: 40 }
      - { pct: 20.0, size_pct: 20 }
    max_hold_hours: 48

  vwap:
    stop_loss_pct: 9.0
    take_profit_levels:
      - { pct: 6.0, size_pct: 40 }
      - { pct: 12.0, size_pct: 40 }
      - { pct: 20.0, size_pct: 20 }
    max_hold_hours: 24

