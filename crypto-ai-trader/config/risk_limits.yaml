# Risk Management Configuration
# Updated 2026-08-03: Tightened SL from 9%/14% to 5%/7% due to strategy degradation
# Weekly Backtest showed 30% drawdowns with previous wide SLs
# Tighter SLs cap downside but may increase stop-out frequency

risk:
  max_position_pct: 10          # Lowered from 15 → 10 (reduce exposure)
  max_total_exposure_pct: 50    # Lowered from 70 → 50
  cash_reserve_pct: 50          # Raised from 30 → 50
  max_daily_loss_pct: 3         # Lowered from 5 → 3
  max_drawdown_pct: 10          # Lowered from 15 → 10
  max_open_positions: 5         # Restored 3 → 5 (CONFIRMED_BULL 2026-08-20, Leo: don't miss chances)
  max_hold_hours: 48

strategies:
  grid:
    stop_loss_pct: 5.0           # Tightened from 9.0
    take_profit_levels:
      - { pct: 4.0, size_pct: 50 }
      - { pct: 8.0, size_pct: 30 }
      - { pct: 15.0, size_pct: 20 }
    max_hold_hours: 48

  dca:
    stop_loss_pct: 7.0           # Tightened from 14.0
    take_profit_levels:
      - { pct: 4.0, size_pct: 50 }
      - { pct: 8.0, size_pct: 30 }
      - { pct: 15.0, size_pct: 20 }
    max_hold_hours: 72

  trend:
    stop_loss_pct: 5.0           # Tightened from 9.0
