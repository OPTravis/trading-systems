# Risk Management Configuration
# Widened SL to survive crypto noise (3-5% SL was getting stopped out in <6h)
# TP1 lowered to 4% for faster partial profit lock-in

risk:
  max_position_pct: 15
  max_total_exposure_pct: 70
  cash_reserve_pct: 30
  max_daily_loss_pct: 5
  max_drawdown_pct: 15
  max_open_positions: 5
  max_hold_hours: 48

strategies:
  grid:
    stop_loss_pct: 7.0
    take_profit_levels:
      - { pct: 4.0, size_pct: 40 }
      - { pct: 8.0, size_pct: 40 }
      - { pct: 14.0, size_pct: 20 }
    max_hold_hours: 48

  dca:
    stop_loss_pct: 10.0
    take_profit_levels:
      - { pct: 4.0, size_pct: 40 }
      - { pct: 8.0, size_pct: 40 }
      - { pct: 15.0, size_pct: 20 }
    max_hold_hours: 72

  trend:
