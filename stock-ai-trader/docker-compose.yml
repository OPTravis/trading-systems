version: '3.8'

services:
  ib-gateway:
    image: gnzsnz/ib-gateway:latest
    container_name: ib-gateway
    restart: unless-stopped
    ports:
      - "4001:4001"  # Paper trading API port
      - "4002:4002"  # Live trading API port
      - "5900:5900"  # VNC server port
      - "6080:6080"  # VNC web client (noVNC)
    environment:
      TWSUSERID: ${TWSUSERID:-}
      TWSPASSWORD: ${TWSPASSWORD:-}
      TRADING_MODE: ${IBC_TradingMode:-paper}
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-}
      TWS_VERSION: latest
      TWOFA_TIMEOUT_ACTION: exit
      RELOGIN_AFTER_2FA_TIMEOUT: no
      TIME_ZONE: US/Eastern
    volumes:
      - ./ib-config:/home/ibgateway/IBC/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - trading-network

networks:
  trading-network:
    driver: bridge
