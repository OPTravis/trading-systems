# 市場定義：交易時間、假期、結算規則

markets:
  US:
    name: "美股"
    exchanges: ["NYSE", "NASDAQ", "AMEX"]
    currency: "USD"
    timezone: "America/New_York"
    trading_hours:
      pre_market:
        start: "04:00"
        end: "09:30"
      regular:
        start: "09:30"
        end: "16:00"
      post_market:
        start: "16:00"
        end: "20:00"
    settlement: "T+1"
    lot_size: 1  # 美股最小單位 1 股
    price_limits: false  # 無漲跌停，有 LULD 熔斷
    luld_thresholds: [0.05, 0.10, 0.20]  # ±5%/±10%/±20%
    pdt_rule:
      enabled: true
      min_equity: 25000  # $25K
      max_day_trades: 3  # 5 天內 ≤3 次
      rolling_days: 5
    holidays_2026:
      - "2026-01-01"  # New Year's Day
      - "2026-01-19"  # MLK Jr. Day
      - "2026-02-16"  # Presidents' Day
      - "2026-04-03"  # Good Friday
      - "2026-05-25"  # Memorial Day
      - "2026-07-03"  # Independence Day (observed)
      - "2026-09-07"  # Labor Day
      - "2026-11-26"  # Thanksgiving
      - "2026-12-25"  # Christmas
    early_close:  # 提前收盤日（13:00 ET）
      - "2026-11-27"  # Day after Thanksgiving
      - "2026-12-24"  # Christmas Eve

  HK:
    name: "港股"
    exchanges: ["HKEX"]
    currency: "HKD"
    timezone: "Asia/Hong_Kong"
    trading_hours:
      pre_market:
        start: "09:00"
        end: "09:30"
      regular_morning:
        start: "09:30"
        end: "12:00"
      lunch_break:
        start: "12:00"
        end: "13:00"
      regular_afternoon:
        start: "13:00"
        end: "16:00"
      post_market:
        start: "16:00"
        end: "16:10"
    settlement: "T+2"
    lot_size: "dynamic"  # 每隻股票不同，需動態查詢
    price_limits: false  # 無漲跌停，有 VCM（市場波動調節機制）
    holidays_2026:
      - "2026-01-01"  # New Year's Day
      - "2026-01-29"  # Lunar New Year
      - "2026-01-30"  # Lunar New Year
      - "2026-01-31"  # Lunar New Year
      - "2026-04-04"  # Ching Ming Festival
      - "2026-04-03"  # Good Friday
      - "2026-04-06"  # Easter Monday
      - "2026-05-01"  # Labour Day
      - "2026-05-24"  # Buddha's Birthday
      - "2026-06-19"  # Tuen Ng Festival
      - "2026-07-01"  # HKSAR Establishment Day
      - "2026-09-26"  # Mid-Autumn Festival
      - "2026-10-01"  # National Day
      - "2026-10-26"  # Chung Yeung Festival
      - "2026-12-25"  # Christmas
      - "2026-12-26"  # Boxing Day

  CN:
    name: "A股"
    exchanges: ["SSE", "SZSE"]
    currency: "CNY"
    timezone: "Asia/Shanghai"
    trading_hours:
      pre_market:
        start: "09:15"
        end: "09:30"
      regular_morning:
        start: "09:30"
        end: "11:30"
      lunch_break:
        start: "11:30"
        end: "13:00"
      regular_afternoon:
        start: "13:00"
        end: "15:00"
    settlement: "T+1"
    lot_size: 100  # A 股最小單位 100 股（1 手）
    price_limits:
      main_board: 0.10      # 主板 ±10%
      gem_star: 0.20        # 創業板/科創板 ±20%
      st_stocks: 0.05       # ST 股 ±5%
    t_plus_1_rule: true     # 當日買入不可當日賣出
    holidays_2026:  # 佔位，需每年更新
      - "2026-01-01"  # 元旦
      - "2026-01-28"  # 春節
      - "2026-01-29"
      - "2026-01-30"
      - "2026-01-31"
      - "2026-02-01"
      - "2026-02-02"
      - "2026-04-04"  # 清明節
      - "2026-04-05"
      - "2026-05-01"  # 勞動節
      - "2026-05-02"
      - "2026-05-03"
      - "2026-05-04"
      - "2026-05-05"
      - "2026-06-19"  # 端午節
      - "2026-10-01"  # 國慶節
      - "2026-10-02"
      - "2026-10-03"
      - "2026-10-04"
      - "2026-10-05"
      - "2026-10-06"
      - "2026-10-07"

  JP:
    name: "日股"
    exchanges: ["TSE"]
    currency: "JPY"
    timezone: "Asia/Tokyo"
    trading_hours:
      pre_market:
        start: "08:00"
        end: "09:00"
      regular_morning:
        start: "09:00"
        end: "11:30"
      lunch_break:
        start: "11:30"
        end: "12:30"
      regular_afternoon:
        start: "12:30"
        end: "15:00"
      post_market:
        start: "15:00"
        end: "15:30"
    settlement: "T+2"
    lot_size: 1
    price_limits:
      daily_limit: 0.30  # ±30% (daily price limit varies by price range)

  UK:
    name: "英國股票"
    exchanges: ["LSE"]
    currency: "GBP"
    timezone: "Europe/London"
    trading_hours:
      regular:
        start: "08:00"
        end: "16:30"
      auction:
        open: "08:00"
        close: "16:35"
    settlement: "T+2"
    lot_size: 1

  EU:
    name: "歐洲股票"
    exchanges: ["XETRA", "Euronext", "SIX"]
    currency: "EUR"
    timezone: "Europe/Berlin"
    trading_hours:
      regular:
        start: "09:00"
        end: "17:30"
    settlement: "T+2"
    lot_size: 1

  AU:
    name: "澳洲股票"
    exchanges: ["ASX"]
    currency: "AUD"
    timezone: "Australia/Sydney"
    trading_hours:
      regular:
        start: "10:00"
        end: "16:00"
    settlement: "T+2"
    lot_size: 1
