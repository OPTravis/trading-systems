# 策略參數配置

# 全局策略設置
global:
  rebalance_frequency: "weekly"      # 週度調倉（降低交易成本）
  max_positions: 20                   # 最多持有 20 只股票
  min_positions: 10                   # 最少持有 10 只
  spot_only: true                     # SPOT ONLY — 不做空、不用杠杆
  min_holding_days: 3                 # 最短持有天數
  signal_threshold: 0.6               # 綜合評分閾值

# 趨勢跟蹤策略
trend_following:
  enabled: true
  weight: 0.20
  params:
    fast_ma: 10
    slow_ma: 30
    adx_threshold: 25       # ADX > 25 才入場
    adx_period: 14
    atr_period: 14
    atr_stop_multiplier: 2.0
  holding_period: [5, 30]   # 5-30 天
  market_regime: ["bull", "neutral"]

# 均值回歸策略
mean_reversion:
  enabled: true
  weight: 0.15
  params:
    rsi_period: 14
    rsi_oversold: 30
    rsi_overbought: 70
    bb_period: 20
    bb_std: 2.0
  holding_period: [3, 10]   # 3-10 天
  market_regime: ["neutral"]

# 動量策略
momentum:
  enabled: true
  weight: 0.20
  params:
    lookback_days: 20
    min_volume_ma: 1000000  # 日均成交量 > 100 萬股
    top_n: 20               # 排名前 20
    breakout_pct: 0.02      # 突破 2% 確認
  holding_period: [10, 30]  # 10-30 天
  market_regime: ["bull"]

# 財報博弈策略
earnings_play:
  enabled: true
  weight: 0.10
  params:
    min_beat_rate: 0.6      # 歷史 beat rate > 60%
    pre_earnings_days: 2    # 財報前 2 天入場
    post_earnings_days: 1   # 財報後 1 天出場
    max_iv_rank: 0.8        # IV rank < 80% 才入場
  holding_period: [1, 5]    # 1-5 天
  market_regime: ["any"]
  blackout_after: true       # 財報後加入黑名單

# 板塊輪動策略
sector_rotation:
  enabled: true
  weight: 0.15
  params:
    lookback_months: 12     # 12-1 月動量
    skip_months: 1          # 跳過最近 1 月
    top_sectors: 3          # 持有 Top 3 板塊
    rebalance_monthly: true
  holding_period: [20, 60]  # 月度持倉
  market_regime: ["bull", "neutral"]

# 配對交易策略
pair_trading:
  enabled: false            # Phase 2+ 啟用
  weight: 0.10
  params:
    cointegration_pvalue: 0.05
    zscore_entry: 2.0       # Z-score > 2 入場
    zscore_exit: 0.5        # Z-score < 0.5 出場
    zscore_stop: 3.0        # Z-score > 3 止損
    lookback_days: 60
  holding_period: [5, 20]
  market_regime: ["neutral"]

# 多因子策略（v2 核心）
factor_strategy:
  enabled: true
  weight: 0.20
  params:
    top_pct: 0.20           # 排名前 20% 做多
    rebalance_weekly: true
    min_market_cap: 2e9     # 最小市值 $2B
    min_avg_volume: 1000000  # 最小日均成交量 (must match risk_limits position_limits.min_liquidity)
    max_pe_ratio: 100       # 排除異常高 PE
  holding_period: [5, 30]
  market_regime: ["bull", "neutral"]
